#   style:            growth_tmt_ls | value_contrarian_ls | quality_generalist | closed_peer
#   status:           active | closed  (documentation metadata only; never used as lookahead)
#   cik:              Primary / current 10-digit zero-padded canonical parent CIK
#   predecessor_ciks: Optional date-bounded CIK migration overrides:
#                       - cik: "0000000000"
#                         name: "Prior legal entity name"
#                         max_filing_date: "YYYY-MM-DD"   # Inclusive upper bound on date_filed
#                         reason: "Why entity migrated"
#   subsidiary_ciks:  Explicitly excluded overlapping subsidiary / affiliate CIKs (dedup)
#   unrelated_ciks:   Known false-positive CIKs matching search_aliases (unrelated firms)
#   search_aliases:   Substrings audited against master.idx to catch new affiliate/successor CIKs
